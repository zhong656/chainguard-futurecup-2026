services:
  chainguard:
    build: .
    image: chainguard:local
    ports:
      - "8000:8000"
    environment:
      # 容器里没有 .git，commit_sha 走环境变量（delivery_artifact 要求 7-40 位十六进制）
      GIT_COMMIT: ${GIT_COMMIT:-0000000}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      # 交付包落盘到宿主机，演示时可直接打开 outputs/ 看 7 件交付物
      - ./outputs:/app/outputs
    restart: unless-stopped
