name: check

# 唯一准入门槛：跑的永远是 make check（= python scripts/check.py）。
# 注意：Free 私有库无 required status checks，红灯在技术上拦不住合并，
#       这里只能保证「每次 push/PR 都留下判定记录」。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只装检查所需的最小依赖：完整 requirements.txt 含 chromadb 等重依赖，
      # 在 CI 里安装会让每次检查多花数分钟，且与「快速反馈」目标冲突。
      #
      # fastapi / httpx / uvicorn 是"轻但有意义"的依赖，必须装：
      #   - tests/test_api.py 用 pytest.importorskip("fastapi")，不装的话 4 条
      #     API 测试会被**静默跳过**，API 坏了 CI 依然全绿；
      #   - scripts/verify_http.py 需要 uvicorn，用来验证服务真能起来。
      - name: Install check deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest
          python -m pip install "fastapi==0.162.0" "httpx==0.28.1" "uvicorn==0.54.0"

      - name: make check
        run: make check

      # 真实 HTTP 验证：TestClient 是进程内 ASGI 调用，证明不了"能作为服务起来"。
      # 这里起真实 uvicorn、走 socket 打三个接口（POST /runs、SSE、artifacts）。
      - name: Verify HTTP service
        run: python scripts/verify_http.py

      # 生成物必须留在本地/CI artifact，不得进 PR（否则每个 PR 都会互相冲突）
      - name: Guard generated files
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" || true
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- 'docs/consistency-report.md' || true)
          if [ -n "$CHANGED" ]; then
            echo "::error file=docs/consistency-report.md::生成物不得入库：请在本地删除该文件改动后重新提交（make check 会重新生成，CI 会以 artifact 形式提供）"
            exit 1
          fi
          echo "✔ 未发现生成物改动"

      - name: Upload consistency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consistency-report
          path: docs/consistency-report.md
          if-no-files-found: warn

      # 契约文件变更时，输出受影响模块与应会签人（不阻断，仅提示）
      - name: Contract impact notice
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" || true
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- 'contracts/*.schema.json' || true)
          if [ -z "$CHANGED" ]; then
            echo "本次 PR 未改动 contracts/，无需跨模块会签。"
            exit 0
          fi
          echo "::notice::本 PR 触及契约文件，需要 ≥1 名非 Owner 成员会签"
          echo "变更的契约："
          echo "$CHANGED"
          echo ""
          echo "应会签人（来自 docs/owners.yaml）："
          python - <<'PY'
          import yaml, subprocess
          owners = yaml.safe_load(open("docs/owners.yaml", encoding="utf-8"))
          co = owners.get("contracts_owners", {})
          roles = owners.get("roles", {})
          changed = subprocess.run(
              ["git", "diff", "--name-only", "HEAD~1", "HEAD"], capture_output=True, text=True
          ).stdout.split()
          seen = set()
          for f in changed:
              name = f.split("/")[-1]
              if name in co:
                  role = co[name]
                  acc = roles.get(role, {}).get("account", "?")
                  if name not in seen:
                      seen.add(name)
                      print(f"  - {name}: Owner {role}（{acc}）")
          print("")
          print("复核要求：≥1 名非 Owner 的成员 approve，且 make check 绿灯。")
          PY


  # 容器验证：Docker 需要管理员权限 + WSL2，不是每台开发机都有；
  # GitHub runner 自带 Docker，所以放到 CI —— 每次 PR 都真构建一次镜像。
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t chainguard:ci .

      - name: Start container
        run: |
          docker run -d --name cg -p 8000:8000 \
            -e GIT_COMMIT=$(git rev-parse HEAD) chainguard:ci

      - name: Verify container endpoints
        run: |
          python -m pip install --quiet "httpx==0.28.1"
          python scripts/verify_container.py

      - name: Container logs on failure
        if: failure()
        run: docker logs cg || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f cg || true
          docker image rm chainguard:ci || true
