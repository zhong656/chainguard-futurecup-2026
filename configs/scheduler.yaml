# 动态调度参数；Scheduler 不在代码中复制这些值。
concurrency:
  max_parallel_nodes: 2
  queue_timeout_s: 1.0

retry:
  max_attempts: 3
  backoff: exponential
  base_delay_s: 0.01
  max_delay_s: 0.05
  retry_on: [timeout, rate_limit, server_error]

timeout:
  default_s: 30.0
  per_node: {}

budget:
  calls_max: 60

degradation:
  on_llm_failure: skip_and_flag
  on_tool_failure: skip_and_flag
  on_verifier_failure: abort
