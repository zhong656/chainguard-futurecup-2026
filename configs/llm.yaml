# 默认离线运行；LLM_PROVIDER 可在运行时选择以下四种 provider。
# 不存凭据。非 Mock 模型名由接入负责人确认后填写；空值表示不可调用。
provider: mock
providers:
  deepseek:
    small: ""
    strong: ""
  qwen:
    small: ""
    strong: ""
  ollama:
    small: ""
    strong: ""
  mock:
    small: mock-small
    strong: mock-strong

tiers:
  small:
    max_tokens: 1024
    temperature: 0.0
    timeout_s: 30
  strong:
    max_tokens: 4096
    temperature: 0.2
    timeout_s: 90

routing:
  planner: strong
  researcher: small
  analyst: strong
  writer: strong
  verifier: strong
  reviewer: strong

# 故障后只切换到已配置模型；切到 Mock 时响应须标记 degraded=true、mock=true。
fallback:
  small: [mock]
  strong: [mock]

budget:
  max_calls_per_run: 60
