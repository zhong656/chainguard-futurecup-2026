# ============================================================
# configs/verifier.yaml —— 评分卡权重与判定阈值
# ------------------------------------------------------------
# 用途：定义三层验证的开关、评分维度与权重、通过阈值、Self-Loop 触发条件。
#      是赛题考察点 5「Self-Loop」与 6「结果验证」的主要可展示证据。
# 落地时间：阶段 3（11/13 规则验证器 + 评分卡，11/15 LoopController）。
# 验收口径：故意造错（假引用 / 数值不一致 / 缺章节）能被 100% 检出。
# ------------------------------------------------------------
# 状态：
#   scorecard 段已定稿（2026-11-05，C，见 docs/CHANGELOG-contracts.md）；
#   layers 段已落地（2026-11-07，B，#59）：代码真的读它，不是装饰；
#   rules 段已按代码真实行为回填（2026-11-06，C，见下方 rules 段）；
#   feedback 段仍为注释占位：反馈库代码已由 #60 合入 main（src/feedback.py，
#     任务单 #42 已关闭），但本文件的 feedback 配置尚无代码消费，不写假配置。
# ============================================================

# layers：三层验证开关（L1 确定性兜底 → L2 模型交叉 → L3 双路比对）
#
# 语义（由 src/verifier.py 强制执行）：
#   rules       L1 规则验证器。**必须为 true**：它是确定性兜底，关掉后
#               citation/consistency/coverage/format 四个维度就没有数据来源，
#               代码会直接拒绝启动，而不是让评分卡凭空填 1.0。
#   llm_judge   L2 独立 Verifier Agent（温度须与 writer 不同）。可关闭：
#               关掉时只返回 L1 评分卡，logic 维度保持 1.0（不做臆测）。
#   cross_check L3 双路检索比对。**2026-11-14 已实现**（src/cross_check.py）：
#               对每条引用分别走 bm25 单路与 vector 单路复核，两路都不命中
#               则报 CROSS_CHECK_MISMATCH（severity=warning）。
layers:
  rules: true
  llm_judge: true
  cross_check: true              # L3 已实现并默认开启（纯本地检索，零模型调用）
                                 #   口径见下方 scorecard 段：cross_check 只观测，
                                 #   不在 weights 内、不加权、不参与一票否决

# scorecard：评分维度与权重（合计必须为 1.0）
scorecard:
  weights:
    citation: 0.30                 # 引用可回溯比例：本项目核心卖点，权重最高
    consistency: 0.20              # 数值与参数表一致性
    coverage: 0.20                 # 章节完整性
    logic: 0.20                    # 论述与结论自洽
    format: 0.10                   # 模板与 Schema 合规：机器可判，故权重最低
  pass_threshold: 0.85             # 未达即触发 Self-Loop
  max_rounds: 3                    # 硬上限，防止成本失控
  convergence:                     # 收敛判据
    stop_if_no_gain_rounds: 2      # 连续两轮无提升即终止并给出原因
  veto:                            # 一票否决：加权分再高也不能掩盖硬伤
    metric_floor: 0.60             # **仅 weights 内**某维 < 0.60 → verdict=fail（观测维度不受此限）
    blocker_issue: true            # 存在 severity=blocker 的 issue → verdict=fail

# 计分口径（LoopController 与 verifier 提示词都按此实现）：
#   score = Σ weights[k] × metrics[k]，结果保留 3 位小数
#   verdict = fail 若 score < pass_threshold
#           或 min(metrics[k] for k in weights) < veto.metric_floor
#           或 issues 中存在 severity=blocker
#   例：metrics 0.55/0.85/0.75/0.80/1.00 → score = 0.745 → fail
#       （见 contracts/examples/scorecard.good.json）

# rules：L1 规则验证器细则
# 只有 sections.required 会被 src/rule_checker.py 读取；schema.strict 是对
# 既有行为的如实声明（draft 一直按契约严格校验），不是可切换的开关。
# 其余项尚无代码消费，故保留注释，避免「配置写 true、实际没做」的假配置。
# 注：#59 的 _layers() / check_layers() 只校验 layers 段，rules 段不参与开关校验。
rules:
  sections:
    # 与 src/rule_checker.py 的 DEFAULT_REQUIRED_SECTIONS 完全一致：
    # 回填后配置成为事实来源，检查行为不变。
    required: [现状痛点, 技术选型, 数据方案, 实施阶段, 成本与ROI, 风险与合规]
  schema:
    strict: true                   # draft 必须通过 contracts/draft.schema.json 校验
#   citation:
#     require_source_id: true      # L1 现报 CITATION_MISSING，尚未做成开关
#     verify_quote_exists: false   # 引用原文逐字比对尚未实现，勿填 true
#   numeric:
#     tolerance: <待定>            # L1 现为「数字集合精确包含」比对，无容差概念

