# ============================================================
# agents/verifier.yaml —— Verifier 验证员
# ------------------------------------------------------------
# 用途：独立打分、定位问题段落、生成可执行的修订指令。
# 输入：Draft + EvidencePool
# 输出：ScoreCard{metrics, issues[], verdict}
# 关键约束：
#   1) 提示词与温度必须与 writer **不同**，避免同源偏差；
#   2) issues[].target_node 用于驱动 Self-Loop 定向回退；
#   3) 与 configs/verifier.yaml 的权重、阈值保持一致。
# 契约：contracts/agent_spec.schema.json（Owner: C，2026-11-07 22:00 冻结）
# ------------------------------------------------------------
# 注：issues 必填字段与 max_items 不属 agent_spec，落在
#     contracts/scorecard.schema.json（issues[].required）与
#     configs/verifier.yaml（scorecard.veto / pass_threshold）。
# ============================================================

name: verifier
display_name: 验证员
role: 独立打分、定位问题段落、生成修订指令
tier: strong                     # 判分要能识破逻辑跳跃，不能降档
tools: [rule_verifier, knowledge_retrieve]
read_only: true                  # 只打分、只定位，绝不修改 Draft
input_schema: VerificationRequest
output_schema: ScoreCard
timeout_s: 120                   # 只读长文 + 打分，标准档
retry: {max_attempts: 2}
temperature: 0.0                 # 必须与 writer(0.3) 不同：判分不采样
system_prompt_ref: prompts/verifier.md
